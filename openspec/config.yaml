schema: spec-driven

context: |
  Personal Android app for designing custom Glyph Matrix designs/animations and running them as Glyph Toys on a Nothing Phone (3).
  Target hardware: Nothing Phone (3), 25x25 Glyph Matrix, per-pixel brightness 0-255.
  Built on Nothing's official GlyphMatrix Developer Kit (.aar, permission com.nothing.ketchum.permission.ENABLE); Glyph Toys are statically declared services (action com.nothing.glyph.TOY).
  App-driven matrix display (setAppMatrixFrame) requires phone system version 20250801+.
  Sideloaded APK for personal use; Play Store publishing is out of scope unless stated.
  Developed on Windows 11.

